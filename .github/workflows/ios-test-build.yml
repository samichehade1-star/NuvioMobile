name: Build Test IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: write

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration }} IPA
    runs-on: macos-26
    timeout-minutes: ${{ inputs.configuration == 'Release' && 75 || 30 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          if [ -n "${RELEASE_PROPERTIES_BASE64}" ]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish AltStore source
        if: inputs.configuration == 'Release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name '*-full-release.ipa' -print -quit)"
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -n 1)"
          build_number="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -n 1)"
          size="$(stat -f%z "${ipa_path}")"
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          short_sha="${GITHUB_SHA:0:7}"
          tag="ios-v${version}-b${build_number}-${GITHUB_RUN_NUMBER}"
          asset_name="$(basename "${ipa_path}")"

          gh release create "${tag}" "${ipa_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nuvio iOS test build ${version} (${build_number})" \
            --notes "Automated unsigned test build from commit ${short_sha}."

          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset_name}"

          mkdir -p altstore
          if [[ -f altstore/source.json ]]; then
            prev_versions="$(jq -c '.apps[0].versions // []' altstore/source.json)"
          else
            prev_versions="[]"
          fi

          new_entry="$(jq -n \
            --arg version "${version}" \
            --arg build "${GITHUB_RUN_NUMBER}" \
            --arg date "${date_iso}" \
            --arg url "${download_url}" \
            --argjson size "${size}" \
            --arg desc "Automated test build from commit ${short_sha}." \
            '{version:$version, buildVersion:$build, date:$date, downloadURL:$url, size:$size, localizedDescription:$desc, minOSVersion:"16.0"}')"

          merged_versions="$(jq -n --argjson new "${new_entry}" --argjson prev "${prev_versions}" \
            '([$new] + $prev) | unique_by(.buildVersion) | .[0:15]')"

          icon_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"

          jq -n \
            --argjson versions "${merged_versions}" \
            --arg iconUrl "${icon_url}" \
            '{
              name: "Nuvio (Personal Test Builds)",
              subtitle: "Unofficial personal test builds of Nuvio",
              description: "Personal AltStore source for sideloading test builds of Nuvio.",
              tintColor: "#F54F32",
              apps: [
                {
                  name: "Nuvio",
                  bundleIdentifier: "com.nuvio.media",
                  developerName: "Nuvio Media",
                  localizedDescription: "Unofficial personal test build of Nuvio for iOS.",
                  iconURL: $iconUrl,
                  versions: $versions,
                  appPermissions: { entitlements: [], privacy: {} }
                }
              ],
              news: []
            }' > altstore/source.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          if git diff --cached --quiet; then
            echo "No AltStore source changes to commit."
          else
            git commit -m "Update AltStore source for ${version} (${build_number})"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "::error::Failed to push altstore/source.json after 5 attempts" >&2
                exit 1
              fi
              echo "Push rejected (attempt ${attempt}), rebasing onto latest ${GITHUB_REF_NAME} and retrying..."
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
          fi
